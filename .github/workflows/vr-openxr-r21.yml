name: OpenXR VR R24 final hardening build

on:
  push:
    branches: [ vr-openxr ]
    paths:
      - 'vrhost/**'
      - 'src/vr/**'
      - 'src/hooks_graphics.cpp'
      - 'OutRun2006Tweaks.ini'
      - '.github/workflows/vr-openxr-r21.yml'
  workflow_dispatch:

jobs:
  host-x64-r24:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify R24 source invariants
        shell: pwsh
        run: |
          $r21 = Get-Content vrhost/src/runtime/r21_runtime_hardening.hpp -Raw
          $r23 = Get-Content vrhost/src/runtime/r23_runtime_hardening.hpp -Raw
          $r24 = Get-Content vrhost/src/runtime/r24_black_screen_guard.hpp -Raw
          $bundle = Get-Content vrhost/src/runtime/r23_verified_bundle.hpp -Raw
          $wait = Get-Content vrhost/src/runtime/bounded_swapchain_wait.hpp -Raw
          $captureWait = Get-Content vrhost/src/runtime/capture_wait_guard.hpp -Raw
          $main = Get-Content vrhost/src/main_r23.cpp -Raw
          $crash = Get-Content vrhost/src/runtime/r21_crash_diagnostics.hpp -Raw
          if (-not $r21.Contains('ReadDirectHostStateReadonly')) { throw 'readonly direct-state reader missing' }
          if (-not $r21.Contains('HostShouldRenderReadonly')) { throw 'shouldRender readonly gate missing' }
          if ($r21 -match 'InterlockedCompareExchange\s*\(') { throw 'write-capable CAS call leaked into R21 readonly path' }
          if (-not $r23.Contains('R23-owned-verified-bundle-submit-20260916')) { throw 'R23 owned-bundle authority missing' }
          if (-not $r23.Contains('RenderCommittedDirect')) { throw 'R23 committed direct safe-copy path missing' }
          foreach ($marker in @(
            'R24-visible-fallback-final-20260916',
            'OutRunVrR23VerifiedBundle::MaxPresentationAgeMs',
            'RenderSafeProjectionChecked',
            'TrySubmitDirectSafeProjection',
            'RenderDirectFlatFallback',
            'BuildEmergencyVisibleQuad',
            'SubmitVisibleFallback',
            'RenderTheaterOverride',
            'BuildCachedVisibleQuad'
          )) {
            if (-not $r24.Contains($marker)) { throw "R24 invariant missing: $marker" }
          }
          if (-not $wait.Contains('SliceNs = 20')) { throw 'bounded wait slice missing' }
          if (-not $wait.Contains('TotalBudgetMs = 250')) { throw 'bounded wait budget missing' }
          if (-not $captureWait.Contains('MaxAcquireWaitMs = 2')) { throw 'desktop capture wait clamp missing' }
          if (-not $captureWait.Contains('ClampDesktopDuplicationWait')) { throw 'desktop capture wait guard missing' }
          if (-not $bundle.Contains('OutRunVR::SharedRenderFrameState frame')) { throw 'verified full frame snapshot missing' }
          if (-not $bundle.Contains('MaxPresentationAgeMs = 1000')) { throw 'verified bundle TTL missing' }
          if (-not $bundle.Contains('publishedAtMs')) { throw 'verified bundle commit time missing' }
          if (-not $main.Contains('R23FrameUnchanged')) { throw 'candidate metadata revalidation missing' }
          if (-not $main.Contains('R23CommitClassicAfterValidation')) { throw 'classic post-validation commit missing' }
          if (-not $main.Contains('R23CommitDirectAfterValidation')) { throw 'direct post-validation commit missing' }
          if (-not $main.Contains('D3D11_MAP_FLAG_DO_NOT_WAIT')) { throw 'non-blocking pixel diagnostic missing' }
          if (-not $main.Contains('ScheduleTheater')) { throw 'theater output diagnostic missing' }
          if (-not $crash.Contains('WriteInitialFaultText(ep, baseName)')) { throw 'fault text is not written before dump' }
          if (-not $crash.Contains('const DumpResult dump = WriteMiniDump(ep, baseName)')) { throw 'minidump attempt missing' }
          if (-not $crash.Contains('AppendDumpResult(baseName, dump)')) { throw 'dump result append missing' }
          $cmake = Get-Content vrhost/CMakeLists.txt -Raw
          if (-not $cmake.Contains('main_r23.cpp')) { throw 'verified host entry point not selected' }
          if (-not $cmake.Contains('r24_black_screen_guard.hpp')) { throw 'R24 final owner not forced into host' }
          if (-not $cmake.Contains('bounded_swapchain_wait.hpp')) { throw 'bounded wait guard not forced into host' }
          if (-not $cmake.Contains('capture_wait_guard.hpp')) { throw 'desktop capture wait guard not forced into host' }

      - name: Verify architecture boundaries
        run: python tools/verify_vr_architecture.py

      - name: Configure x64 host
        run: cmake -S vrhost -B build-r24-host -G "Visual Studio 17 2022" -A x64

      - name: Build x64 host and tests
        run: cmake --build build-r24-host --config RelWithDebInfo

      - name: Run host smoke tests
        shell: pwsh
        run: |
          foreach ($test in @(
            'outrun-vr-shader-smoke.exe',
            'outrun-vr-protocol-v3-smoke.exe',
            'outrun-vr-host-state-v3-channel-smoke.exe',
            'outrun-vr-v2-v3-shadow-conversion-smoke.exe',
            'outrun-vr-host-pose-v3-validation-smoke.exe',
            'outrun-vr-core-math-smoke.exe',
            'outrun-vr-runtime-eligibility-smoke.exe',
            'outrun-vr-r23-verified-bundle-smoke.exe'
          )) {
            $path = Join-Path 'build-r24-host/bin' $test
            if (-not (Test-Path $path)) { throw "missing smoke executable: $test" }
            & $path
            if ($LASTEXITCODE -ne 0) { throw "smoke failed: $test code=$LASTEXITCODE" }
          }

      - name: Verify R24 final host binary and symbols
        shell: pwsh
        run: |
          $hostPath = 'build-r24-host/bin/outrun-vr-host.exe'
          $pdbPath = 'build-r24-host/bin/outrun-vr-host.pdb'
          if (-not (Test-Path $hostPath)) { throw 'outrun-vr-host.exe was not produced' }
          if (-not (Test-Path $pdbPath)) { throw 'outrun-vr-host.pdb was not produced' }
          $bytes = [IO.File]::ReadAllBytes($hostPath)
          if ($bytes.Length -lt 10000) { throw 'outrun-vr-host.exe unexpectedly small' }
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @(
            'R24-visible-fallback-final-20260916',
            '[R24] exact committed classic projection submitted directly',
            '[R24] DirectGPU final submit uses host-owned SafeEye',
            '[R24] last successfully released projection/theater image preserved visibility while stereo recovers',
            '[R24] host-owned Direct SafeEye shown as a flat view while stereo projection recovers',
            '[R24] emergency visible quad submitted because no game image was safely displayable',
            'xrWaitSwapchainImage exceeded 250ms',
            '[R23 pixel]',
            'menu-local-fixed-projection-cached',
            'R23-crash-text-first-20260916'
          )) {
            if (-not $ascii.Contains($marker)) { throw "R24 host marker missing: $marker" }
          }
          $pe = [BitConverter]::ToInt32($bytes,0x3C)
          if ([BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x8664) { throw 'expected x64 host' }

      - uses: actions/upload-artifact@v4
        with:
          name: outrun-vr-r24-final-host-x64-symbols
          path: |
            build-r24-host/bin/outrun-vr-host.exe
            build-r24-host/bin/outrun-vr-host.pdb
          if-no-files-found: error


  game-x86-r26-hud-current:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure current Win32 R26-safe HUD test build
        shell: cmd
        run: |
          set CI=
          cmake -S . -B build-r26hud-current -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF -DOUTRUN_VR_R26_HUD_COMPARE=ON

      - name: Apply dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-r26hud-current/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-r26hud-current/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-r26hud-current/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-r26hud-current/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-r26hud-current/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-r26hud-current/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-r26hud-current/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build-r26hud-current/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-r26hud-current/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build current Win32 R26-safe HUD DLL
        run: cmake --build build-r26hud-current --config Release

      - name: Verify current R26-safe HUD binary
        shell: pwsh
        run: |
          $dllPath = 'build-r26hud-current/bin/dinput8.dll'
          if (-not (Test-Path $dllPath)) { throw 'current R26-safe HUD dinput8.dll was not produced' }
          $bytes = [IO.File]::ReadAllBytes($dllPath)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @(
            'VR R26+HUD SAFE TEST: R26/R23 world path + R30 HUD/XYZRHW/SkyGlow overlay ACTIVE',
            'VR R30 FLAT EFFECT: depth-disabled alpha perspective overlay is world-locked on a finite virtual plane',
            'VR C1.2 FIXEDFN HEAD: perspective fixed-function XYZ world receives the same latched head inverse',
            'VR R40 CADENCE: runtime-gated PhaseLock active',
            'VR R30.6 XYZRHW WORLD',
            'VR R41 XYZRHW HUD: fixed-function HUD uses HudScale on a finite recentered world-locked plane',
            'VR R30.10 XYZRHW DEPTH: stable non-unit RHW accepted as world depth',
            'VR R30.11 XYZRHW DEPTH: perspective screen-Z accepted as world depth even when RHW=1',
            'VR R30 BUFFER SHADOW: lazy capture armed only after a real XYZRHW',
            'R30.6/DrawIndexedPrimitiveVB-ShadowXYZRHW',
            'VR D3D9Ex R38: per-slot GPU-completion ACK aware free-slot scan ACTIVE',
            'VR DIRECT-ONLY: shared-eye frame deferred without blocking; incomplete handles are never published',
            'VR AUTO HOST: launched',
            'VR PC MIRROR: fitting borderless window to monitor',
            'VR PRESENT: desktop D3D9 VSync bypass active'
          )) {
            if (-not $ascii.Contains($marker)) { throw "current R26-safe HUD marker missing: $marker" }
          }
          $pe = [BitConverter]::ToInt32($bytes,0x3C)
          if ([BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x014C) { throw 'expected x86 R26-safe HUD DLL' }
          Get-FileHash $dllPath -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: outrun-vr-current-test-r26-hud-x86
          path: build-r26hud-current/bin/dinput8.dll
          if-no-files-found: error
